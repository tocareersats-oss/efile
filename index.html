@media (prefers-color-scheme:dark){:root{--bg:#0f1722;--fg:#e6ecf4;--card:#172231;--bd:#2c3b50;--ac:#3dbdb1;--acf:#06201d;--mu:#9bb0c8;--red:#ff8a80;--ok:#6fd49a;--wn:#f0b45a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,"Noto Sans Malayalam","Segoe UI",sans-serif}
.w{max-width:960px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:0}
h3{margin:10px 0 6px;font-size:16px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px;padding-bottom:10px;border-bottom:2px solid var(--fg)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:7px 10px}
textarea,input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],select.f{width:100%}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.on,button.p{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.5;cursor:wait}
.tabs button{border-radius:6px 6px 0 0;padding:6px 9px;font-size:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:12px;margin-bottom:10px}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.m{color:var(--mu);font-size:13px}
.b{display:inline-block;font-size:12px;padding:1px 8px;border-radius:4px;border:1px solid var(--bd)}
.hi{color:var(--red);border-color:var(--red)}.cl{color:var(--ok);border-color:var(--ok)}.wn{color:var(--wn);border-color:var(--wn)}
.it{cursor:pointer;border-left:4px solid var(--ac)}.it.u{border-left-color:var(--red)}.it:hover{border-color:var(--ac)}
.lg{border-left:3px solid var(--bd);padding:2px 0 2px 10px;margin:8px 0}
label{display:block;margin:8px 0 3px;font-size:13px;color:var(--mu)}
label.k{display:inline-flex;gap:6px;align-items:center;margin:4px 12px 4px 0;color:var(--fg);font-size:14px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left;font-size:14px;vertical-align:top}
.lo{max-width:380px;margin:8vh auto}
.er{color:var(--red)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 12px}
.sec{margin-top:14px;padding-top:10px;border-top:1px dashed var(--bd)}

  if(hs)t.push(['in','ഇൻബോക്സ് ('+inboxF().length+')'],['rem','ഓർമ്മപ്പെടുത്തൽ ('+dueRems().length+')'],['tp','വന്ന തപാൽ ('+myTapals().length+')'],['new','പുതിയ ഫയൽ'],['sent','ഞാൻ കൈകാര്യം ചെയ്തവ']);
  t.push(['srch','തിരയുക']);
  if(hs)t.push(['rep','എന്റെ റിപ്പോർട്ട്']);
  if(perm('tapal'))t.push(['treg','തപാൽ രജിസ്റ്റർ']);
  if(perm('despatch'))t.push(['dreg','ഡെസ്പാച്ച് രജിസ്റ്റർ']);
  if(perm('view_all'))t.push(['rec','റെക്കോർഡ്സ്']);
  let u=t;
  if(Array.isArray(me.menus)&&!me.is_admin)u=t.filter(x=>me.menus.includes(x[0]));
  if(me.is_admin)u.push(['all','എല്ലാ ഫയലുകളും'],['arep','സ്ഥാപന റിപ്പോർട്ട്']);
  if(canAdm()){const n=(isChief()?RQ.filter(r=>r.status=='pending'&&r.requested_by!=uid).length:0)+(me.is_admin?RQ.filter(r=>r.status=='approved').length:0);u.push(['adm','അഡ്മിനിസ്ട്രേഷൻ'+(n?' ('+n+')':'')])}
  if(me.is_admin||isChief())u.push(['aud','ഓഡിറ്റ്']);
  return u.length?u:[['srch','തിരയുക']];
}

async function chPw(){

function badge(f){return `${f.priority=='h'?'<span class="b hi">അടിയന്തിരം</span>':''}${f.due_on?`<span class="b ${f.status=='open'&&f.due_on<todayL()?'hi':''}">സമയപരിധി ${fmtD(f.due_on)}${f.status=='open'&&f.due_on<todayL()?' — കഴിഞ്ഞു':''}</span>`:''}<span class="b">${ORG[f.origin]}</span><span class="b ${f.status=='closed'?'cl':''}">${f.status=='closed'?'തീർപ്പാക്കി ('+E(f.disposal||'')+')':'തുറന്നത്'}</span>`}

async function act(id,k,s){
  const n=($('an')||{value:''}).value.trim();
  if(k=='r'&&!n){A('തിരിച്ചയക്കുമ്പോൾ കാരണം നോട്ടിൽ എഴുതുക');return}
  let r;
  if(k=='f')r=await call('forward_file',{p_id:id,p_note:n,p_seat:s});
  else if(k=='r')r=await call('return_file',{p_id:id,p_note:n,p_seat:s});
  else{const d=$('ad').value;if(!d){A('ഡിസ്‌പോസൽ വിഭാഗം (R / D / K / L) തിരഞ്ഞെടുക്കുക');return}if(!C('ഫയൽ തീർപ്പാക്കിയാൽ പിന്നീട് മാറ്റാൻ പറ്റില്ല. തുടരട്ടെ?'))return;r=await call('close_file',{p_id:id,p_note:n,p_seat:s,p_disposal:d})}
  if(r.ok){await loadAll();openId=null;tab='in';render()}
}
async function linkF(id,s){

async function submitReq(kind,payload){
  let reason='';
  if(!setupMode()&&!isChief()){
    reason=PR('അഭ്യർത്ഥനയുടെ കാരണം എഴുതുക','');
    if(reason===null)return false;
    if(!reason.trim()){A('കാരണം നിർബന്ധമാണ്');return false}
  }
  const r=await call('submit_request',{p_kind:kind,p_payload:payload,p_reason:reason});
  if(!r.ok)return false;
  await loadAll();
  const q=RQ.find(x=>x.id==r.data);
  if(q&&q.status=='approved'&&me.is_admin&&EDGE.includes(q.kind)){await execEdge(q.id)}
  else if(q)A(q.status=='executed'?'മാറ്റം നടപ്പിലായി.':q.status=='approved'?'ചീഫ് അനുവദിച്ചു. അഡ്മിൻ നടപ്പാക്കണം.':'ചീഫിന്റെ അനുമതിക്കായി അയച്ചു.');
  render();return true;
}

async function execReq(id){

}
async function execEdge(id){
  const q=RQ.find(x=>x.id==id);if(!q)return;
  const pw=PR(q.kind=='create_user'?'പുതിയ ജീവനക്കാരന് നൽകേണ്ട പാസ്‌വേഡ് (കുറഞ്ഞത് 8 അക്ഷരം). ഇത് ഒരിടത്തും സൂക്ഷിക്കില്ല; ജീവനക്കാരനോട് പറയുക.':'പുതിയ പാസ്‌വേഡ് (കുറഞ്ഞത് 8 അക്ഷരം). ഇത് ഒരിടത്തും സൂക്ഷിക്കില്ല; ജീവനക്കാരനോട് പറയുക.','');
  if(pw===null)return;
  if(pw.length<8){A('പാസ്‌വേഡിന് കുറഞ്ഞത് 8 അക്ഷരം വേണം');return}
  const {data,error}=await SB.functions.invoke('admin-user',{body:{request_id:id,password:pw}});
  let msg=error?error.message:(data&&data.error);
  if(error&&error.context&&error.context.json){try{const j=await error.context.json();msg=j.error||msg}catch(e){}}
  if(msg){A(/Failed to send|Failed to fetch|not found/i.test(msg)?'യൂസർ സർവീസ് (admin-user) ഇതുവരെ ഡിപ്ലോയ് ചെയ്തിട്ടില്ല, അല്ലെങ്കിൽ എത്തിച്ചേരാൻ പറ്റുന്നില്ല.':msg);return}
  await loadAll();render();A('നടപ്പിലായി.');
}

  const e=$('nu_e').value.trim(),n=$('nu_n').value.trim();
  if(!e||!n){A('ഇമെയിലും പേരും എഴുതുക');return}
  const ms=ticked('nu_m',MENUS);
  await submitReq('create_user',{email:e,name:n,seat_id:$('nu_s').value||null,perms:ticked('nu_p',PERMS),menus:ms.length==MENUS.length?null:ms});
}
async function saveUser(id){
  const n=$('un_'+id).value.trim();if(!n){A('പേര് എഴുതുക');return}
  const ms=ticked('um_'+id,MENUS);
  await submitReq('update_user',{user_id:id,name:n,seat_id:$('us_'+id).value||null,perms:ticked('up_'+id,PERMS),menus:ms.length==MENUS.length?null:ms,is_admin:$('ua_'+id).checked,active:$('uc_'+id).checked});
}
function seatsView(){
  const intro=ST.length?'':'<div class="c"><b>തുടക്കം:</b> ആദ്യം ഏറ്റവും മുകളിലെ സീറ്റ് (ഉദാ: മാനേജിംഗ് ഡയറക്ടർ) മേലധികാരി ഇല്ലാതെ ചേർക്കുക. പിന്നെ അതിന് താഴെയുള്ള സീറ്റുകൾ.</div>';
  return intro+`<div class="c"><b>പുതിയ സീറ്റ്</b><div class="g2"><div><label for="ns">സീറ്റിന്റെ പേര് (തസ്തിക)</label><input id="ns" type="text"></div><div><label for="nc">സെക്ഷൻ (ഐച്ഛികം)</label><input id="nc" type="text"></div><div><label for="nb">മേലധികാരി സീറ്റ്</label><select id="nb" class="f">${seatOpts('','— ഏറ്റവും മുകളിൽ —')}</select></div></div><p><button class="p" onclick="addSeat()">ചേർക്കാൻ അഭ്യർത്ഥിക്കുക</button></p></div>`+
  ST.map(s=>{const ex=desc(s.id);return `<div class="c"><div class="r"><b>${E(s.name)}</b>${s.is_chief?'<span class="b cl">ചീഫ് സീറ്റ്</span>':''}${s.active?'':'<span class="b hi">നിർത്തി</span>'}<span class="m">${seatUsers(s.id).map(un).join(', ')||'ആരുമില്ല'}</span></div><div class="g2"><div><label for="sn_${s.id}">പേര്</label><input id="sn_${s.id}" type="text" value="${E(s.name)}"></div><div><label for="sc_${s.id}">സെക്ഷൻ</label><input id="sc_${s.id}" type="text" value="${E(s.section)}"></div><div><label for="sb_${s.id}">മേലധികാരി സീറ്റ്</label><select id="sb_${s.id}" class="f">${seatOpts(s.boss_seat,'— ഏറ്റവും മുകളിൽ —',ST.filter(x=>x.active&&!ex.has(x.id)).map(x=>x.id))}</select></div></div><label class="k"><input id="sa_${s.id}" type="checkbox" ${s.active?'checked':''}> സജീവം</label><p class="r"><button class="p" onclick="saveSeat('${s.id}')">മാറ്റം സമർപ്പിക്കുക</button>${!s.boss_seat&&s.active&&!s.is_chief?`<button onclick="submitReq('set_chief_seat',{seat_id:'${s.id}'})">ചീഫ് സീറ്റ് ആക്കാൻ അഭ്യർത്ഥിക്കുക</button>`:''}</p></div>`}).join('');
}
async function addSeat(){
  const n=$('ns').value.trim();if(!n){A('പേര് എഴുതുക');return}
  await submitReq('create_seat',{name:n,section:$('nc').value.trim(),boss_seat:$('nb').value||null});
}
async function saveSeat(id){
  const n=$('sn_'+id).value.trim();if(!n){A('പേര് എഴുതുക');return}
  await submitReq('update_seat',{seat_id:id,name:n,section:$('sc_'+id).value.trim(),boss_seat:$('sb_'+id).value||null,active:$('sa_'+id).checked});
}
function delegView(){
  const vac=ST.filter(s=>s.active&&!seatUsers(s.id).length);
  return `${vac.length?`<div class="c"><b class="er">ആരുമില്ലാത്ത സീറ്റുകൾ:</b> ${vac.map(s=>sn(s.id)+' ('+F.filter(f=>f.status=='open'&&hold(f)==s.id).length+' ഫയൽ)').join(' · ')}<div class="m">ഇവിടെയുള്ള ഫയലുകൾ കാത്തിരിക്കും. താഴെ ചുമതല നൽകാൻ അഭ്യർത്ഥിക്കുക.</div></div>`:''}
  <div class="c"><b>ചുമതല കൈമാറ്റം</b> <span class="m">(ഒരാൾ ലീവിലാണെങ്കിൽ അദ്ദേഹത്തിന്റെ സീറ്റിന്റെ അധികാരം മറ്റൊരാൾക്ക്, തീയതി വരെ)</span>
  <div class="g2"><div><label for="ds1">സീറ്റ്</label><select id="ds1" class="f">${seatOpts('','— തിരഞ്ഞെടുക്കുക —')}</select></div><div><label for="du1">ചുമതല ഏൽക്കുന്ന ആൾ</label><select id="du1" class="f">${opts(P.filter(p=>p.active).map(p=>[p.id,E(p.name)+' ('+(p.seat_id?sn(p.seat_id):'സീറ്റ് ഇല്ല')+')']),'','— തിരഞ്ഞെടുക്കുക —')}</select></div><div><label for="dfr">മുതൽ</label><input id="dfr" type="date" value="${todayS()}"></div><div><label for="dto">വരെ (ഒഴിച്ചിട്ടാൽ അവസാനിപ്പിക്കുന്നത് വരെ)</label><input id="dto" type="date"></div></div>
  <label for="drs">കാരണം</label><input id="drs" type="text" placeholder="ഉദാ: ലീവ്"><p><button class="p" onclick="addDel()">ചുമതല നൽകാൻ അഭ്യർത്ഥിക്കുക</button></p></div>
  <div class="c sc"><b>നിലവിലെ / മുൻ ചുമതലകൾ</b><table><tr><th>സീറ്റ്</th><th>ആൾ</th><th>കാലയളവ്</th><th>കാരണം</th><th></th></tr>${SA.map(a=>`<tr><td>${sn(a.seat_id)}</td><td>${un(a.user_id)}</td><td>${fmtD(a.from_date)} – ${a.to_date?fmtD(a.to_date):'…'}</td><td>${E(a.reason)}</td><td>${!a.active?'<span class="b">അവസാനിപ്പിച്ചു</span>':covers(a)?`<button onclick="submitReq('end_delegation',{id:${a.id}})">അവസാനിപ്പിക്കാൻ അഭ്യർത്ഥിക്കുക</button>`:'<span class="b">'+(a.from_date>todayS()?'വരാനുള്ളത്':'കഴിഞ്ഞു')+'</span>'}</td></tr>`).join('')||'<tr><td colspan="5" class="m">ഒന്നുമില്ല</td></tr>'}</table></div>`;
}
async function addDel(){
  const s=$('ds1').value,u=$('du1').value;if(!s||!u){A('സീറ്റും ആളും തിരഞ്ഞെടുക്കുക');return}
  await submitReq('add_delegation',{seat_id:s,user_id:u,from_date:$('dfr').value||todayS(),to_date:$('dto').value||null,reason:$('drs').value.trim()});
}
function setView(){
  const pd=+CFG.pending_days||5;
  return `<div class="c"><label for="pdv">"പെൻഡിംഗ്" മുന്നറിയിപ്പിനുള്ള പ്രവൃത്തി ദിവസം (മാനുവൽ: 5)</label><div class="r"><input id="pdv" type="number" min="1" max="90" value="${pd}" style="width:90px"><button class="p" onclick="submitReq('set_setting',{key:'pending_days',value:String(Math.max(1,Math.min(90,+$('pdv').value||5)))})">മാറ്റാൻ അഭ്യർത്ഥിക്കുക</button></div></div>
  <div class="c"><b>അവധി ദിവസങ്ങൾ</b> <span class="m">(ഞായർ സ്വയം ഒഴിവാകും; മറ്റ് അവധികൾ ഇവിടെ ചേർക്കുക)</span><div class="r" style="margin:6px 0"><input id="hd" type="date" style="width:170px"><input id="hn" type="text" placeholder="പേര്" style="flex:1;min-width:140px"><button class="p" onclick="addHol()">ചേർക്കാൻ അഭ്യർത്ഥിക്കുക</button></div>${HO.map(h=>`<div class="r"><span>${fmtD(h.day)}</span><span class="m">${E(h.name)}</span><button onclick="submitReq('del_holiday',{day:'${h.day}'})">നീക്കാൻ അഭ്യർത്ഥിക്കുക</button></div>`).join('')||'<span class="m">ഒന്നും ചേർത്തിട്ടില്ല</span>'}</div>`;
}
