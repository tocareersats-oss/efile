<!DOCTYPE html>
<html lang="ml"><head><meta charset="utf-8">
<title>e-File</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap"><style>
:root{--bg:#eef2f7;--fg:#15233b;--card:#fff;--bd:#d9e1ec;--ac:#14508f;--acf:#fff;--mu:#5b6b82;--red:#b3261e;--ok:#17703f;--wn:#9a5b00;--gold:#c8962e;--side:#0f2a4a;--side2:#16365d;--sidefg:#cfe0f5;--note:#fff8dc;--notebd:#ecd98a;--cur:#eaf3ff;--curbd:#b9d4f5;--sh:0 1px 2px rgba(15,42,74,.06),0 4px 14px rgba(15,42,74,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1320;--fg:#e5ecf6;--card:#142034;--bd:#27384f;--ac:#5aa2f0;--acf:#06182c;--mu:#93a7c2;--red:#ff8a80;--ok:#6fd49a;--wn:#f0b45a;--gold:#e0b04e;--side:#08111f;--side2:#0e1b30;--sidefg:#aec4e0;--note:#2a2512;--notebd:#5a4d1c;--cur:#10233d;--curbd:#2a4b78;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "Inter","Noto Sans Malayalam",system-ui,"Segoe UI",sans-serif}
.w{max-width:none;margin:0;padding:0}
h1{font-size:18px;margin:0}h2{margin:4px 0 6px;font-size:21px;line-height:1.3}h3{margin:10px 0 6px;font-size:16px}
a{color:var(--ac)}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 11px}
textarea,input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=month],select.f{width:100%}
button{cursor:pointer;transition:background .15s,border-color .15s,transform .05s}
button:hover{border-color:var(--ac)}button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.on,button.p{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.5;cursor:wait}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--side),var(--side2));color:var(--sidefg);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 14px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px}
.brand b{display:block;color:#fff;font-size:15px;line-height:1.25}.brand span{font-size:12px;color:var(--gold);letter-spacing:.4px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#f3d98a);display:grid;place-items:center;font-size:22px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.ng{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#7f9bbd;margin:14px 10px 4px}
.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-radius:9px;color:var(--sidefg);padding:9px 11px;margin:1px 0}
.side button:hover{background:rgba(255,255,255,.08)}
.side button.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
.side .ic{width:22px;text-align:center;font-size:17px}
.side .nb{margin-left:auto;background:var(--gold);color:#1b2a40;border-radius:99px;font-size:12px;font-weight:700;padding:0 8px;min-width:22px;text-align:center}
.main{min-width:0}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 18px;position:sticky;top:0;z-index:5;box-shadow:var(--sh)}
.bar .ttl{font-size:18px;font-weight:700}
.who{display:flex;gap:9px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;background:var(--ac);color:var(--acf);display:grid;place-items:center;font-weight:700}
#v{padding:18px;max-width:1180px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.m{color:var(--mu);font-size:13px}
.b{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;border:1px solid var(--bd);background:var(--bg)}
.hi{color:var(--red);border-color:var(--red)}.cl{color:var(--ok);border-color:var(--ok)}.wn{color:var(--wn);border-color:var(--wn)}
.it{cursor:pointer;border-left:5px solid var(--ac)}.it.u{border-left-color:var(--red)}.it:hover{border-color:var(--ac);transform:translateY(-1px)}
.lg{border-left:3px solid var(--bd);padding:2px 0 2px 10px;margin:8px 0}
label{display:block;margin:9px 0 3px;font-size:13px;color:var(--mu)}
label.k{display:inline-flex;gap:6px;align-items:center;margin:4px 12px 4px 0;color:var(--fg);font-size:14px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--bd);padding:7px;text-align:left;font-size:14px;vertical-align:top}th{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.lo{max-width:400px;margin:7vh auto}
.lobg{min-height:100vh;display:grid;align-items:center;background:radial-gradient(1000px 500px at 80% -10%,#1d4f8c33,transparent),linear-gradient(160deg,var(--side),var(--side2));padding:16px}
.lobg .c{box-shadow:0 20px 60px rgba(0,0,0,.35)}
.er{color:var(--red)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
.sec{margin-top:14px;padding-top:10px;border-top:1px dashed var(--bd)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer;box-shadow:var(--sh);border-top:4px solid var(--ac)}
.kpi:hover{transform:translateY(-2px)}.kpi .n{font-size:30px;font-weight:800;line-height:1.1}.kpi .e{font-size:22px}.kpi.red{border-top-color:var(--red)}.kpi.gold{border-top-color:var(--gold)}.kpi.ok{border-top-color:var(--ok)}
.hero{background:linear-gradient(120deg,var(--side),var(--ac));color:#fff;border-radius:16px;padding:20px 22px;margin-bottom:14px;box-shadow:var(--sh)}
.hero h2{color:#fff;margin:0}.hero .m{color:#d6e6fb}
.cover{background:var(--card);border:1px solid var(--bd);border-top:8px solid var(--ok);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh);position:relative}
.cover.closed{border-top-color:var(--ac)}.cover.conf{border-top-color:var(--red)}
.fno{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;background:var(--bg);border:1px dashed var(--mu);padding:5px 9px;border-radius:6px}
.stamp{position:absolute;right:16px;top:14px;border:2px solid var(--ok);color:var(--ok);padding:2px 12px;border-radius:6px;font-weight:800;letter-spacing:2px;transform:rotate(-5deg);font-size:13px;opacity:.85}
.cover.closed .stamp{border-color:var(--ac);color:var(--ac)}.stamp.cf{border-color:var(--red);color:var(--red);right:auto;left:auto;position:static;display:inline-block;transform:none;margin-left:8px}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:8px 0}
.chip{background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:2px 11px;font-size:13px}.chip.cur{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}.arr{color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet{border-radius:10px;padding:12px 14px;border:1px solid}
.sheet.note{background:var(--note);border-color:var(--notebd)}.sheet.cur{background:var(--cur);border-color:var(--curbd)}
.sheet h3{margin-top:0}
.para{display:flex;gap:10px;margin:9px 0;padding-bottom:9px;border-bottom:1px dotted var(--notebd)}.para:last-child{border-bottom:0}
.pn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1b2a40;font-weight:800;font-size:12px;display:grid;place-items:center}
.pb{min-width:0;overflow-wrap:anywhere}.ph{font-size:12.5px;color:var(--mu)}
.doc{background:var(--card);border:1px solid var(--curbd);border-radius:8px;padding:9px 11px;margin:8px 0}
details.tool{border:1px solid var(--bd);border-radius:10px;margin:8px 0;background:var(--bg)}
details.tool summary{cursor:pointer;padding:9px 12px;font-weight:600}
details.tool>div{padding:2px 12px 12px}
.tl{margin:6px 0}
@media (max-width:900px){
 .shell{grid-template-columns:1fr}
 .side{position:static;height:auto;display:flex;flex-wrap:nowrap;overflow-x:auto;padding:8px;gap:2px}
 .side .brand,.side .ng{display:none}
 .side button{white-space:nowrap;width:auto;padding:8px 11px}
 .two{grid-template-columns:1fr}
 #v{padding:12px}
 .bar{position:static}
 .stamp{position:static;display:inline-block;transform:none;margin:6px 0}
}
@media print{.side,.bar{display:none}.shell{display:block}}

const kindL=k=>k=='attach'?tt('Attachment added'):k=='draft'?tt('Draft'):(KIND[k]||E(k));
const draftEv=id=>DE.filter(e=>e.draft_id==id).sort((a,b)=>a.id-b.id);
const draftLast=id=>{const e=draftEv(id);return e.length?e[e.length-1].event:null};
const DST={put_up:['wn','Waiting for approval'],approved:['cl','Approved'],returned:['hi','Returned for revision'],issued:['cl','Issued']};
const fsize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function attList(rows){
  if(!rows.length)return '<div class="m">'+tt('No attachments.')+'</div>';
  return rows.map(a=>`<div class="r doc">📎 <b>${E(a.name)}</b><span class="m">${a.size?fsize(a.size):''} · ${un(a.by_user)} · ${fmtD(a.created_at)}</span><span style="flex:1"></span><button onclick="dlAtt(${a.id})">⬇ ${tt('Download')}</button></div>`).join('');
}
async function dlAtt(id){
  const a=AT.find(x=>x.id==id);if(!a)return;
  const {data,error}=await SB.storage.from('efile-attachments').createSignedUrl(a.path,60,{download:a.name});
  if(error){A(error.message);return}
  window.open(data.signedUrl,'_blank');
}
async function upAtt(kind,id,seat){
  const inp=$('upf_'+kind+id);const f=inp&&inp.files[0];if(!f){A(tt('Choose a file first'));return}
  if(f.size>10*1024*1024){A(tt('The file is larger than 10 MB'));return}
  const safe=f.name.replace(/[^A-Za-z0-9._-]+/g,'_');const path=`${kind}${id}/${Date.now()}-${safe}`;
  const up=await SB.storage.from('efile-attachments').upload(path,f,{upsert:false,contentType:f.type||undefined});
  if(up.error){A(up.error.message);return}
  const r=await call('register_attachment',{p_file:kind=='f'?id:null,p_tapal:kind=='t'?id:null,p_seat:seat||null,p_name:f.name,p_path:path,p_size:f.size,p_mime:f.type||null});
  if(r.ok){await loadAll();render()}
}
const upCtl=(kind,id,seat)=>`<div class="r"><input id="upf_${kind}${id}" type="file" style="max-width:260px"><button onclick="upAtt('${kind}',${id},${seat?"'"+seat+"'":'null'})">⬆ ${tt('Upload')}</button></div><div class="m">${tt('Up to 10 MB per file. Uploaded documents cannot be changed or deleted.')}</div>`;

function draftCard(d,f,h,mineH){
  const last=draftLast(d.id),st=DST[last]||['', '—'],evs=draftEv(d.id);
  const child=DR.some(x=>x.parent_id==d.id);
  let acts='';
  if(mineH&&last=='put_up'&&anc(d.created_seat).includes(h))acts=`<button class="p" onclick="decideDraft(${d.id},true,'${h}')">✔ ${tt('Approve draft')}</button><button onclick="decideDraft(${d.id},false,'${h}')">↩ ${tt('Return draft')}</button>`;
  if(mineH&&last=='approved'&&h==d.created_seat)acts=`<select id="im_${d.id}">${opts(Object.entries(MODE))}</select><button class="p" onclick="issueDraft(${d.id},'${h}')">📤 ${tt('Issue (send to despatch)')}</button>`;
  if(mineH&&last=='returned'&&h==d.created_seat&&!child)acts=`<button onclick="reviseDraft(${d.id})">✏️ ${tt('Revise')}</button>`;
  return `<div class="doc"><div class="r"><b>D${d.seq}.${d.version}</b><span class="b">${formL(d.form)}</span><span class="b ${st[0]}">${tt(st[1])}</span><span class="m">${un(d.created_by)} · ${fmtD(d.created_at)}</span></div>
  <div><b>${E(d.subject)}</b></div>${d.addressee?`<div class="m">${tt('To')}: ${E(d.addressee)}</div>`:''}
  <details><summary class="m">${tt('Show text')}</summary><div style="white-space:pre-wrap;margin-top:6px">${E(d.body)}</div></details>
  ${evs.filter(e=>e.note).map(e=>`<div class="m">${DST[e.event]?tt(DST[e.event][1]):e.event}: ${E(e.note)}</div>`).join('')}
  <p class="r"><button onclick="printDraft(${d.id})">🖨 ${tt('Print / fair copy')}</button>${acts}</p></div>`;
}

async function act(id,k,s){
  const n=($('an')||{value:''}).value.trim();
  if(k=='r'&&!n){A('തിരിച്ചയക്കുമ്പോൾ കാരണം നോട്ടിൽ എഴുതുക');return}
  let r;
  if(k=='f')r=await call('forward_file',{p_id:id,p_note:n,p_seat:s});
  else if(k=='r')r=await call('return_file',{p_id:id,p_note:n,p_seat:s});
  else{const d=$('ad').value;if(!d){A('ഡിസ്‌പോസൽ വിഭാഗം (R / D / K / L) തിരഞ്ഞെടുക്കുക');return}if(!C('ഫയൽ തീർപ്പാക്കിയാൽ പിന്നീട് മാറ്റാൻ പറ്റില്ല. തുടരട്ടെ?'))return;
    r=await call('close_file',{p_id:id,p_note:n,p_seat:s,p_disposal:d,p_index_head:$('ih').value,p_index_sub:$('is').value,p_index_title:$('it').value})}
  if(r.ok){await loadAll();openId=null;tab='in';render()}
}

function reviseDraft(id){

  const r=await call('decide_draft',{p_draft:id,p_approve:ok,p_note:n,p_seat:s});if(r.ok){await loadAll();render()}
}

async function submitReq(kind,payload){
  let reason='';
  if(!setupMode()&&!isChief()){
    reason=PR('അഭ്യർത്ഥനയുടെ കാരണം എഴുതുക','');
    if(reason===null)return false;
    if(!reason.trim()){A('കാരണം നിർബന്ധമാണ്');return false}
  }
  const r=await call('submit_request',{p_kind:kind,p_payload:payload,p_reason:reason});
  if(!r.ok)return false;
  await loadAll();
  const q=RQ.find(x=>x.id==r.data);
  if(q&&q.status=='approved'&&me.is_admin&&EDGE.includes(q.kind)){await execEdge(q.id)}
  else if(q)A(q.status=='executed'?'മാറ്റം നടപ്പിലായി.':q.status=='approved'?'ചീഫ് അനുവദിച്ചു. അഡ്മിൻ നടപ്പാക്കണം.':'ചീഫിന്റെ അനുമതിക്കായി അയച്ചു.');
  render();return true;
}
async function decide(id,ok){
  const n=PR(ok?'കുറിപ്പ് (ഐച്ഛികം)':'നിരസിക്കാനുള്ള കാരണം','');if(n===null)return;
  const r=await call('decide_request',{p_id:id,p_approve:ok,p_note:n});if(r.ok){await loadAll();render()}
}
async function cancelReq(id){if(!C('ഈ അഭ്യർത്ഥന റദ്ദാക്കണോ?'))return;const r=await call('cancel_request',{p_id:id});if(r.ok){await loadAll();render()}}
async function execReq(id){
  const q=RQ.find(x=>x.id==id);if(!q)return;
  if(EDGE.includes(q.kind)){await execEdge(id);return}
  const r=await call('execute_request',{p_id:id});if(r.ok){await loadAll();render();A('മാറ്റം നടപ്പിലായി.')}
}
async function execEdge(id){
  const q=RQ.find(x=>x.id==id);if(!q)return;
  const pw=PR(q.kind=='create_user'?'പുതിയ ജീവനക്കാരന് നൽകേണ്ട പാസ്‌വേഡ് (കുറഞ്ഞത് 8 അക്ഷരം). ഇത് ഒരിടത്തും സൂക്ഷിക്കില്ല; ജീവനക്കാരനോട് പറയുക.':'പുതിയ പാസ്‌വേഡ് (കുറഞ്ഞത് 8 അക്ഷരം). ഇത് ഒരിടത്തും സൂക്ഷിക്കില്ല; ജീവനക്കാരനോട് പറയുക.','');
  if(pw===null)return;
  if(pw.length<8){A('പാസ്‌വേഡിന് കുറഞ്ഞത് 8 അക്ഷരം വേണം');return}
  const {data,error}=await SB.functions.invoke('admin-user',{body:{request_id:id,password:pw}});
  let msg=error?error.message:(data&&data.error);
  if(error&&error.context&&error.context.json){try{const j=await error.context.json();msg=j.error||msg}catch(e){}}
  if(msg){A(/Failed to send|Failed to fetch|not found/i.test(msg)?'യൂസർ സർവീസ് (admin-user) ഇതുവരെ ഡിപ്ലോയ് ചെയ്തിട്ടില്ല, അല്ലെങ്കിൽ എത്തിച്ചേരാൻ പറ്റുന്നില്ല.':msg);return}
  await loadAll();render();A('നടപ്പിലായി.');
}
